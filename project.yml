# Lockstep - Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen)
#
# On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open Lockstep.xcodeproj
#
# Before building, change the three values under "settings > base" below to your own
# (Apple team ID, bundle ID, app group). Everything else picks them up automatically.

name: Lockstep

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: ""                       # your 10-character Apple Team ID
    APP_BUNDLE_ID: com.example.lockstep        # must be unique on the App Store
    APP_GROUP_ID: group.com.example.lockstep   # "group." + something unique
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  Lockstep:
    type: application
    platform: iOS
    sources:
      - path: Lockstep
      - path: Shared
    dependencies:
      - target: LockstepMonitor
      - target: LockstepShieldConfiguration
      - target: LockstepShieldAction
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Lockstep/Info.plist
      properties:
        CFBundleDisplayName: Lockstep
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(APP_BUNDLE_ID).sync]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Lockstep/Lockstep.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.applesignin: [Default]
        aps-environment: development

  # Runs in the background when a session or break timer ends, and counts
  # screen time on the apps you choose to share with friends.
  LockstepMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockstepMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).monitor
    info:
      path: Extensions/LockstepMonitor/Info.plist
      properties:
        CFBundleDisplayName: Lockstep Monitor
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockstepMonitorExtension
    entitlements:
      path: Extensions/LockstepMonitor/LockstepMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # Draws the screen you see when you open a blocked app.
  LockstepShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockstepShieldConfiguration
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shieldconfiguration
    info:
      path: Extensions/LockstepShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Lockstep Shield
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockstepShieldConfigurationExtension
    entitlements:
      path: Extensions/LockstepShieldConfiguration/LockstepShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # Handles the buttons on that block screen.
  LockstepShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockstepShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shieldaction
    info:
      path: Extensions/LockstepShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Lockstep Shield Action
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockstepShieldActionExtension
    entitlements:
      path: Extensions/LockstepShieldAction/LockstepShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
